name: Runtime regression
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.12']
        include:
          - os: ubuntu-latest
            python: '3.11'
    runs-on: ${{ matrix.os }}
    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: .matplotlib-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install CJK fonts (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: python -m pip install -r scripts/requirements.txt
      - run: python -m unittest discover -s scripts -p 'test_*.py' -v
